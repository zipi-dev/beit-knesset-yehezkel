<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול אירועים | בית הכנסת יחזקאל</title>
    <link rel="icon" type="image/png" href="../../icon.png">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <script type="module" src="../js/adminGuard.js"></script>
    <script type="module" src="../js/eventsAdmin.js"></script>
</head>

<body class="admin-page" dir="rtl" data-roles="admin">
    <header>
        <h1>ניהול אירועים</h1>
        <p id="admin-greeting"></p>
        <a href="./dashboard.html">חזרה ללוח הניהול</a>
        <button id="logout-btn" type="button">התנתק</button>
    </header>
    <main>
        <form id="event-form">
            <label for="name">שם האירוע</label>
            <input type="text" id="name" maxlength="200" required>
            <label for="eventDate">תאריך</label>
            <input type="date" id="eventDate" required>
            <label for="text">תיאור</label>
            <textarea id="text" maxlength="2000"></textarea>
            <label for="photographer">צלם</label>
            <input type="text" id="photographer" maxlength="100">
            <label for="mediaUrl">קישור למדיה (תמונה / יוטיוב)</label>
            <input type="url" id="mediaUrl">
            <label for="image">תמונה (לא חובה - JPG / PNG / WEBP, עד 5MB)</label>
            <input type="file" id="image" accept="image/jpeg,image/png,image/webp,image/gif">
            <img id="image-preview" class="hidden image-preview" alt="תצוגה מקדימה">
            <button type="button" id="remove-image-btn" class="hidden secondary">הסר תמונה</button>
            <button type="submit" id="submit-btn">הוסף אירוע</button>
            <button type="button" id="cancel-btn" class="hidden secondary">ביטול עריכה</button>
        </form>
        <ul id="events-list"></ul>
    </main>
</body>
</html>
